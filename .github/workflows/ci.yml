name: CI

on:
  push:
    branches: [main, dev, py]
  pull_request:

# Cancel obsolete PR runs, but never interrupt main verification/deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      website: ${{ steps.classify.outputs.website }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo 'scope=full' >> "$GITHUB_OUTPUT"
          paths_file="$RUNNER_TEMP/archify-changed-paths.txt"
          : > "$paths_file"
          website=false
          if [[ "$CI_EVENT_NAME" == pull_request ]]; then
            : "${CI_BASE_SHA:?missing pull request base SHA}"
            git diff --name-only "$CI_BASE_SHA" "$GITHUB_SHA" > "$paths_file"
          elif [[ "$CI_EVENT_NAME" == push && "$CI_REF" == refs/heads/main ]]; then
            # Every main push publishes Pages, so always produce the verified site artifact.
            website=true
          elif [[ "$CI_EVENT_NAME" == push && -n "$CI_BEFORE_SHA" && ! "$CI_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$CI_BEFORE_SHA" "$GITHUB_SHA" > "$paths_file"
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              website/*) website=true; break ;;
            esac
          done < "$paths_file"
          echo "website=$website" >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    if: always() && !cancelled()
    name: Python static and distribution checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$CI_SCOPE" = full
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared runtime and build requirements
        run: >-
          "$PYTHON_PATH" -m pip install -r archify/python/requirements.txt -r archify/python/requirements-build.txt
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Run the Python suite (browser tests report an opt-in skip)
        run: >-
          "$PYTHON_PATH" -B scripts/run_tests.py
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - name: Build and install the wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="$RUNNER_TEMP/archify-dist"
          mkdir -p "$dist_dir"
          "$PYTHON_PATH" -m build --no-isolation --sdist --wheel --outdir "$dist_dir"
          "$PYTHON_PATH" -m pip install --no-deps "$dist_dir"/archify-*.whl
          "$PYTHON_PATH" -m pip install --no-deps --force-reinstall "$dist_dir"/archify-*.tar.gz
          cd "$RUNNER_TEMP"
          archify --help > /dev/null
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}

  webm-artifact:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$CI_SCOPE" = full
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'
      - name: Install declared browser requirements
        run: >-
          "$PYTHON_PATH" -m pip install -r archify/python/requirements-browser.txt
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Install Chromium and Linux browser dependencies
        run: >-
          "$PYTHON_PATH" -m playwright install --with-deps chromium
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Install the WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Run the real Chromium Viewer regression gate
        run: >-
          "$PYTHON_PATH" -B -m unittest discover -s archify/python/tests -p "test_native*browser.py" -v
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_BROWSER_TESTS: '1'
          ARCHIFY_BROWSER_TEST_OUT: ${{ runner.temp }}
          PYTHONPATH: archify/python
      - name: Verify WebM export decodes to distinct frames
        run: >-
          "$PYTHON_PATH" -B -m unittest discover -s archify/python/tests -p test_native_webm_browser.py -v
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_WEBM_TESTS: '1'
          ARCHIFY_WEBM_TEST_OUT: ${{ runner.temp }}
          PYTHONPATH: archify/python

  zip-freshness:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$CI_SCOPE" = full
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Run maintained Node packaging tests and Viewer source check
        run: |
          node --test scripts/test/*.test.mjs
          node scripts/generate-viewer.mjs --check
      - name: Rebuild the canonical archive and compare SHA-256
        shell: bash
        run: |
          set -euo pipefail
          fresh_archive="$RUNNER_TEMP/archify-fresh.zip"
          scripts/build-zip.sh "$fresh_archive"
          committed_sha="$(sha256sum archify.zip | cut -d ' ' -f 1)"
          fresh_sha="$(sha256sum "$fresh_archive" | cut -d ' ' -f 1)"
          if [[ "$committed_sha" != "$fresh_sha" ]]; then
            echo "::error::archify.zip is stale (committed $committed_sha, rebuilt $fresh_sha)"
            exit 1
          fi

  published-update-manifest:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$CI_SCOPE" = full
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'
      - name: Install the archive smoke runtime
        run: >-
          "$PYTHON_PATH" -m pip install -r archify/python/requirements.txt
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Verify the published stable Release asset and tagged Skill tree
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$("$PYTHON_PATH" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          manifest = json.loads(Path('docs/skill-updates/archify/stable.json').read_text(encoding='utf-8'))
          version = manifest.get('version')
          if manifest.get('schemaVersion') != 1 or manifest.get('skillId') != 'archify' or manifest.get('channel') != 'stable':
              raise SystemExit('stable.json has the wrong identity or channel')
          if not isinstance(version, str) or not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('stable.json version must be a stable semantic version')
          source = manifest.get('source') or {}
          artifact = manifest.get('artifact') or {}
          if source.get('repository') != 'https://github.com/' + os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('stable.json source repository does not match this repository')
          if source.get('ref') != 'v' + version or not re.fullmatch(r'[0-9a-f]{40}', str(source.get('treeSha', ''))):
              raise SystemExit('stable.json source tag or tree SHA is invalid')
          if not re.fullmatch(r'[0-9a-f]{64}', str(artifact.get('sha256', ''))):
              raise SystemExit('stable.json artifact SHA-256 is invalid')
          if manifest.get('releaseNotes') != 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tag/v' + version:
              raise SystemExit('stable.json releaseNotes URL does not match its version')
          print(version)
          PY
          )"
          latest_stable_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          if [[ "$latest_stable_tag" != "v${manifest_version}" ]]; then
            echo "::error::stable.json v${manifest_version} must match the latest published stable Release ${latest_stable_tag:-'(missing)'}"
            exit 1
          fi
          release_asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${manifest_version}" --jq 'select(.draft == false and .prerelease == false) | .assets[] | select(.name == "archify.zip") | .id')"
          if [[ -z "$release_asset_id" ]]; then
            echo "::error::v${manifest_version} must have a published stable GitHub Release with an archify.zip asset"
            exit 1
          fi
          published_archive="$RUNNER_TEMP/archify-v${manifest_version}.zip"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${release_asset_id}" \
            -H 'Accept: application/octet-stream' > "$published_archive"
          manifest_sha="$("$PYTHON_PATH" -c 'import json; from pathlib import Path; print(json.loads(Path("docs/skill-updates/archify/stable.json").read_text(encoding="utf-8"))["artifact"]["sha256"])')"
          published_sha="$(sha256sum "$published_archive" | cut -d ' ' -f 1)"
          if [[ "$published_sha" != "$manifest_sha" ]]; then
            echo "::error::published archify.zip SHA-256 does not match stable.json"
            exit 1
          fi
          git fetch --force --no-tags --depth=1 origin \
            "refs/tags/v${manifest_version}:refs/tags/v${manifest_version}"
          tagged_tree_sha="$(git rev-parse "v${manifest_version}^{tree}")"
          manifest_tree_sha="$("$PYTHON_PATH" -c 'import json; from pathlib import Path; print(json.loads(Path("docs/skill-updates/archify/stable.json").read_text(encoding="utf-8"))["source"]["treeSha"])')"
          if [[ "$tagged_tree_sha" != "$manifest_tree_sha" ]]; then
            echo "::error::stable.json source tree SHA does not match v${manifest_version}"
            exit 1
          fi
          tagged_archive="$RUNNER_TEMP/archify-tag-v${manifest_version}.zip"
          git show "v${manifest_version}:archify.zip" > "$tagged_archive"
          if ! cmp -s "$published_archive" "$tagged_archive"; then
            echo "::error::published archify.zip must byte-match archify.zip committed at v${manifest_version}"
            exit 1
          fi
          "$PYTHON_PATH" scripts/package-smoke.py "$published_archive"
          if git cat-file -e "v${manifest_version}:scripts/stage-clean-skill.mjs" 2>/dev/null \
            && git cat-file -e "v${manifest_version}:scripts/write-deterministic-zip.mjs" 2>/dev/null; then
            tag_checkout="$RUNNER_TEMP/archify-tag-v${manifest_version}"
            rebuilt_archive="$RUNNER_TEMP/archify-rebuilt-v${manifest_version}.zip"
            git worktree add --detach "$tag_checkout" "v${manifest_version}"
            "$tag_checkout/scripts/build-zip.sh" "$rebuilt_archive"
            rebuilt_sha="$(sha256sum "$rebuilt_archive" | cut -d ' ' -f 1)"
            if [[ "$rebuilt_sha" != "$published_sha" ]]; then
              echo "::error::the published archify.zip is not the deterministic build of v${manifest_version}"
              exit 1
            fi
          elif [[ "$manifest_version" == "2.15.0" ]]; then
            echo "::notice::v2.15.0 predates the deterministic builder; its asset is bound to the exact tagged archive blob"
          else
            echo "::error::v${manifest_version} is missing the deterministic archive builder"
            exit 1
          fi

  package-smoke:
    needs: scope
    if: always() && !cancelled()
    name: package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$CI_SCOPE" = full
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.9'
      - name: Install the declared runtime requirement (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          "$PYTHON_PATH" -m pip install -r archify/python/requirements.txt
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Install the declared runtime requirement (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PYTHON_PATH -m pip install -r archify/python/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Smoke test the committed ZIP (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          "$PYTHON_PATH" scripts/package-smoke.py archify.zip
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Smoke test the committed ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PYTHON_PATH scripts/package-smoke.py archify.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}

  windows-test-portability:
    needs: scope
    if: always() && !cancelled()
    name: Windows Python portability (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: windows-latest
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: pwsh
        run: |
          if ($env:SCOPE_RESULT -ne 'success' -or $env:CI_SCOPE -ne 'full') { exit 1 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared runtime and build requirements
        shell: pwsh
        run: |
          & $env:PYTHON_PATH -m pip install -r archify/python/requirements.txt -r archify/python/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      - name: Run the Python suite (browser tests report an opt-in skip)
        shell: pwsh
        run: |
          & $env:PYTHON_PATH -B scripts/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          ARCHIFY_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - name: Build and install the wheel and source distribution
        shell: pwsh
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP 'archify-dist'
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          & $env:PYTHON_PATH -m build --no-isolation --sdist --wheel --outdir $distDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem -Path $distDir -Filter 'archify-*.whl')
          $sourceDistribution = @(Get-ChildItem -Path $distDir -Filter 'archify-*.tar.gz')
          if ($wheel.Count -ne 1 -or $sourceDistribution.Count -ne 1) { throw 'Expected one wheel and one source distribution.' }
          & $env:PYTHON_PATH -m pip install --no-deps $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_PATH -m pip install --no-deps --force-reinstall $sourceDistribution[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          archify --help | Out-Null
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}

  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Typecheck and build website
        run: npm run check && npm run build && npm test
        working-directory: website
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: website-chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify built website navigation and language continuity
        run: npm run test:browser
        working-directory: website
        env:
          ARCHIFY_SITE_ROOT: ${{ github.workspace }}/website/dist
          ARCHIFY_SITE_INTEGRATION: '1'
          ARCHIFY_CHROME: ${{ steps.website-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Build and validate the Cloudflare static website
        run: npm run build && node scripts/check-cloudflare-output.mjs && node --test test/deployment-target.test.mjs
        working-directory: website
        env:
          ARCHIFY_SITE_TARGET: cloudflare
      - name: Verify Cloudflare navigation and language continuity
        run: npm run test:browser
        working-directory: website
        env:
          ARCHIFY_SITE_ROOT: ${{ github.workspace }}/website/dist-cloudflare
          ARCHIFY_SITE_BASE: ''
          ARCHIFY_SITE_INTEGRATION: '1'
          ARCHIFY_CHROME: ${{ steps.website-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: website-dist
          path: website/dist
          include-hidden-files: true
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: website-cloudflare-dist
          path: website/dist-cloudflare
          include-hidden-files: true
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, webm-artifact, zip-freshness, published-update-manifest, package-smoke, windows-test-portability, website]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Pages deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - name: Configure GitHub Pages
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download verified website build
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-dist
          path: website/dist
      - name: Upload verified website
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
      - name: Deploy verified website
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Enable after configuring a Pages project with production branch main.
  # Disable Git-connected automatic deployments so they cannot bypass these gates.
  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: [test, webm-artifact, zip-freshness, published-update-manifest, package-smoke, windows-test-portability, website]
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Validate Cloudflare destination
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}[a-z0-9]$ ]] || exit 1
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || exit 1
          # Wrangler also discovers Functions relative to its working directory.
          test ! -e functions
      - name: Download verified Cloudflare website build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-cloudflare-dist
          path: website/dist-cloudflare
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Cloudflare deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - name: Deploy verified Cloudflare website
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          packageManager: npm
          command: pages deploy website/dist-cloudflare --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
